name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump — auto derives it from conventional commits since the last tag
        required: true
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Build
        run: pnpm --filter "@pinpoint/*" build

      - name: Bump version + changelog
        id: release
        run: node scripts/release/run.mjs "${{ inputs.bump }}"

      - name: Commit, tag, push
        if: steps.release.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json \
            packages/core/package.json \
            packages/claude-code/package.json \
            packages/claude-code/.claude-plugin/plugin.json \
            packages/claude-code/bin/pinpoint \
            CHANGELOG.md
          git commit -m "chore(release): ${{ steps.release.outputs.tag }}"
          git tag -a "${{ steps.release.outputs.tag }}" -m "${{ steps.release.outputs.tag }}"
          git push origin HEAD:main --follow-tags

      - name: GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.release.outputs.tag }}"
          --title "${{ steps.release.outputs.tag }}"
          --notes-file RELEASE_NOTES.md
