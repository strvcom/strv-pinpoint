# Local pre-commit gates. See https://lefthook.dev/configuration/
#
# Three checks run in parallel on every commit:
# - backlog-boundary: blocks files under backlog/{decisions,docs,milestones}/
#   (those belong in docs/decisions.md and docs/superpowers/, not on the board).
# - biome: format + lint check on the actual staged files.
# - typecheck: project-wide tsc --noEmit (tsc takes no file list, and it's fast
#   enough here to run on every commit).
pre-commit:
  parallel: true
  jobs:
    - name: backlog-boundary
      run: scripts/guard-backlog-boundary.sh
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,mjs,cjs}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
